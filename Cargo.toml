[package]
name = "dhcp-mock"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Minimal DHCPv4 mock server for debugging directly attached devices"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lanshuye123/DHCPMock"
homepage = "https://github.com/lanshuye123/DHCPMock"
readme = "README.md"
keywords = ["dhcp", "dhcpv4", "debugging", "networking", "embedded"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "dhcp_mock"
path = "src/lib.rs"

[[bin]]
name = "dhcp-mock"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
rtnetlink = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
